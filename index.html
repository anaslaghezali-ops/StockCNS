<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stock ChickNSter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: left rail ordered by the manager's day (do, then check), one calm work column.
     Colour is reserved for what needs attention; a normal stock line stays neutral. */
  --bg:#f3f4ef; --surface:#ffffff; --ink:#18201c; --muted:#626d65; --line:#dcdfd6;
  --accent:#135f48; --accent-ink:#ffffff; --warn:#9a5a00; --crit:#bf3320;
  --font:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111613; --surface:#1a211d; --ink:#e8ece8; --muted:#98a39b; --line:#2c352f;
    --accent:#5ecfa6; --accent-ink:#0c1410; --warn:#f0b455; --crit:#ff8370;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111613; --surface:#1a211d; --ink:#e8ece8; --muted:#98a39b; --line:#2c352f;
  --accent:#5ecfa6; --accent-ink:#0c1410; --warn:#f0b455; --crit:#ff8370;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);display:flex}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
small{font-size:13px;font-weight:400}
small,.muted{color:var(--muted)}
a{color:var(--accent)}

/* rail */
nav{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{font-weight:700;font-size:20px;padding:0 10px 18px;letter-spacing:-.01em}
.grp{font-size:13px;color:var(--muted);padding:14px 10px 4px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--bg)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.badge{background:var(--crit);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;font-weight:600;line-height:20px}
nav a[aria-current="page"] .badge{background:var(--accent-ink);color:var(--accent)}
.foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
#sync{padding:0 10px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

main{flex:1;min-width:0;overflow:auto;padding:34px 40px 80px}
#view{max-width:1060px;display:flex;flex-direction:column;gap:26px}
.vh{display:flex;flex-direction:column;gap:6px}
.vh p{color:var(--muted);max-width:68ch;font-size:17px}
section{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.panel.flush{padding:6px 0}
.panel.hl{border-color:var(--accent);border-width:2px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.help{color:var(--muted);max-width:75ch}

/* today */
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task>div{flex:1;min-width:0;display:flex;flex-direction:column}
.task b{font-weight:600}
.mark{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700}
.task.done .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done b{font-weight:500;color:var(--muted)}
.task.warn .mark{border-color:var(--crit);color:var(--crit)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice b{font-weight:600}
.choice small{color:var(--muted)}
.choice[aria-pressed="true"]{border:2px solid var(--accent);padding:13px 15px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.panel.flush th:first-child,.panel.flush td:first-child{padding-left:20px}
.panel.flush th:last-child,.panel.flush td:last-child{padding-right:20px}
tbody tr:last-child>*{border-bottom:0}
thead th{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
tbody th{font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
td.b{font-weight:700}
tr.fam th{font-size:13px;color:var(--muted);font-weight:500;padding-top:16px;border-bottom:0;padding-bottom:2px}
tr.tot>*{border-top:2px solid var(--line);font-weight:700}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.low{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.out,.pill.neg{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.pill.info{border:1px solid var(--line);color:var(--muted);font-weight:500}
.q.low{color:var(--warn);font-weight:700}
.q.out,.q.neg{color:var(--crit);font-weight:700}
.pos{color:var(--accent);font-weight:600}.negv{color:var(--crit);font-weight:700}
.todo{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;border-left:3px solid var(--line);padding:2px 0 2px 14px}
.kpi b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14px}
.kpi.crit{border-color:var(--crit)}.kpi.crit b{color:var(--crit)}

/* controls */
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:500}
label.inl{display:inline;color:inherit;font-size:inherit;font-weight:inherit}
label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:400;font-size:15px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;min-height:42px}
input:hover,select:hover{border-color:var(--muted)}
input.qty{width:110px;text-align:right;font-weight:600}
input.num{text-align:right}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--accent);padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:600 15px var(--font);border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
button:hover,.btn:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{padding:12px 22px;font-size:16px}
button.ghost{padding:5px 10px;font-size:14px;font-weight:500;color:var(--muted)}
button[data-armed]{border-color:var(--crit);color:var(--crit)}
button:disabled{opacity:.5;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border-radius:99px;font-weight:500;padding:7px 15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--ink);font-size:16px;font-weight:400}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop b{font-weight:600;font-size:17px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--line);border-radius:6px;font-weight:500}
details[open]>summary::before{content:"–"}
details[open]>summary{margin-bottom:14px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* settings */
.prod{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:18px;padding:18px 20px;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.prod legend{font-weight:600;padding:0;margin-bottom:8px}
.prod .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.prod input{width:100%}
.rcp{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rcp:last-child{border-bottom:0}
.rcp .sum{display:flex;align-items:center;gap:12px}
.rcp .sum>div{flex:1;min-width:0;display:flex;flex-direction:column}
.rcp .line{display:grid;grid-template-columns:minmax(0,320px) 100px auto;gap:8px;align-items:center}
.rcp .ed{display:flex;flex-direction:column;gap:12px;padding:4px 0 8px}
#login{max-width:380px}
#login input{width:100%}
#toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:500;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:min(440px,90vw)}
#toast.on{opacity:1;transform:none}
#toast.err{background:var(--crit);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:900px){
  body{flex-direction:column}
  nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;align-items:center}
  .brand{padding:0 10px 0 4px}.grp,#sync{display:none}.foot{margin:0 0 0 auto;padding:0}nav a{white-space:nowrap}
  main{padding:22px 16px 60px}h1{font-size:25px}
  .prod{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav aria-label="Sections">
  <div class="brand">Stock ChickNSter</div>
  <a href="#accueil" data-v="accueil">Aujourd'hui <span class="badge" id="nt" hidden></span></a>
  <div class="grp">Saisir</div>
  <a href="#ventes" data-v="ventes">Ventes</a>
  <a href="#mouvements" data-v="mouvements">Entrées et sorties</a>
  <a href="#inventaire" data-v="inventaire">Inventaire</a>
  <div class="grp">Consulter</div>
  <a href="#stock" data-v="stock">Stock</a>
  <a href="#commandes" data-v="commandes">À commander <span class="badge" id="nb" hidden></span></a>
  <div class="foot">
    <a href="#reglages" data-v="reglages">Réglages</a>
    <div id="sync">Chargement…</div>
    <button class="ghost" id="logout" hidden>Se déconnecter</button>
  </div>
</nav>
<main><div id="view"><div class="panel">Chargement des données…</div></div></main>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* Connexion à la base : URL du projet Supabase et clé publique. */
const SUPABASE_URL="https://ubroliirvztmjfojdfvy.supabase.co";
const SUPABASE_KEY="sb_publishable_VCGMqjBFlKLQ7tffXY50GA_LpsPnt-3";

const FAMILIES=['Boissons','Pain','Poulet','Sachets','Boîtes burger'];
const TYPES={reception:['Réception fournisseur','Une livraison arrive au dépôt ou dans un restaurant.'],transfert:['Transfert','Du stock part du dépôt vers un restaurant.'],perte:['Perte ou casse','Du stock est jeté, abîmé ou offert.']};
const VIEWS=['accueil','ventes','mouvements','inventaire','stock','commandes','reglages'];
const S={sites:[],products:[],menu:[],moves:[],sales:[],counts:[],cfg:{}};
const ready={};
let db=null,EV={},CNT={};
const today=()=>new Date().toLocaleDateString('en-CA');
const ui={move:{type:'reception',date:today(),site:'',to:''},sale:{date:today(),site:'',open:false},count:{date:today(),site:'',sel:''},imp:null,stock:{site:''},set:{tab:'produits',edit:'',filter:'stock',q:''}};
const view=document.getElementById('view');

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r3=x=>Math.round(x*1000)/1000;
const f=(n,d=2)=>{const v=+(+n).toFixed(d);return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:d}).format(v===0?0:v)};
const money=n=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' DH';
const num=v=>{v=String(v??'').trim().replace(/\s/g,'').replace(',','.');if(v==='')return null;const x=parseFloat(v);return isFinite(x)?x:null};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const dfr=d=>{const [y,m,j]=String(d).split('-');return j+'/'+m+'/'+y};
const dobj=d=>{const [y,m,j]=String(d).split('-');return new Date(+y,m-1,+j)};
const dlong=d=>dobj(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const dayDiff=(a,b)=>Math.round((dobj(b)-dobj(a))/864e5);
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId=(arr,id)=>arr.find(x=>x.id===id);
const pl=(n,one,many)=>n+' '+(n>1?many:one);
const famIdx=x=>{const i=FAMILIES.indexOf(x);return i<0?99:i};
const prods=()=>[...S.products].sort((a,b)=>famIdx(a.family)-famIdx(b.family)||String(a.family).localeCompare(b.family)||String(a.name).localeCompare(b.name,'fr'));
const depots=()=>S.sites.filter(s=>s.type==='depot');
const restos=()=>S.sites.filter(s=>s.type!=='depot');
const sitesSorted=()=>[...depots(),...restos()];
const opts=(list,sel)=>list.map(x=>`<option value="${esc(x.id)}"${x.id===sel?' selected':''}>${esc(x.name)}</option>`).join('');
const pname=p=>`${esc(p.name)} <small>${esc(p.unit||'')}</small>`;
let tt;
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',err?5000:2400)}
function errMsg(e){return "Enregistrement impossible"+(e&&e.message?" : "+e.message:". Réessayez.")}
async function w(fn,ok){if(!db){toast("Connectez-vous pour enregistrer.",true);return false}
  try{await fn();if(ok)toast(ok);return true}catch(e){toast(errMsg(e),true);return false}}

/* ---------- stock engine ---------- */
function rebuild(){
  EV={};CNT={};
  const push=(s,date,pid,d)=>{if(!s||!d)return;(EV[s]=EV[s]||[]).push({date,pid,d})};
  for(const m of S.moves){for(const [pid,q] of Object.entries(m.lines||{})){const x=+q||0;
    if(m.type==='reception')push(m.siteId,m.date,pid,x);
    else if(m.type==='perte')push(m.siteId,m.date,pid,-x);
    else if(m.type==='transfert'){push(m.siteId,m.date,pid,-x);push(m.toSiteId,m.date,pid,x)}}}
  for(const s of S.sales)for(const [pid,q] of Object.entries(s.usage||{}))push(s.siteId,s.date,pid,-(+q||0));
  for(const c of S.counts)(CNT[c.siteId]=CNT[c.siteId]||[]).push(c);
  for(const k in CNT)CNT[k].sort((a,b)=>a.date<b.date?-1:1);
}
/* Inventaire = comptage de fin de journée : il remplace le stock calculé à cette date. */
function stockAt(siteId,pid,asOf='9999-99-99',strict=false){
  let base=0,from='';const cs=CNT[siteId]||[];
  for(let i=cs.length-1;i>=0;i--){const c=cs[i];
    if((strict?c.date<asOf:c.date<=asOf)&&c.counted&&c.counted[pid]!=null){base=+c.counted[pid]||0;from=c.date;break}}
  for(const e of EV[siteId]||[])if(e.pid===pid&&e.date>from&&e.date<=asOf)base+=e.d;
  return r3(base);
}
function use7(siteId,pid){const from=daysAgo(7);let t=0;
  for(const s of S.sales)if(s.date>from&&(!siteId||s.siteId===siteId))t+=+(s.usage||{})[pid]||0;return t}
const minOf=(site,p)=>site.type==='depot'?p.minD:p.minR;
function status(site,p,q){const min=minOf(site,p);
  if(q<0)return 'neg';if(min>0&&q<=0)return 'out';if(min>0&&q<min)return 'low';return 'ok'}
const PILL={neg:'Négatif',out:'Rupture',low:'Bas'};
const pill=(st,hasMin)=>st==='ok'?(hasMin?'<span class="muted">OK</span>':'<span class="muted" title="Aucun seuil défini pour ce produit">–</span>'):`<span class="pill ${st}">${PILL[st]}</span>`;
function costOf(lines){let t=0;for(const [pid,q] of Object.entries(lines||{})){const p=byId(S.products,pid);if(p&&p.cost!=null)t+=(+q||0)*p.cost}return t}
function gaps(c){
  const initial=(CNT[c.siteId]||[])[0]===c;const rows=[];let total=0;
  for(const p of prods()){if(!c.counted||c.counted[p.id]==null)continue;
    const counted=+c.counted[p.id]||0,theo=initial?null:stockAt(c.siteId,p.id,c.date,true);
    const diff=initial?0:r3(counted-theo),val=p.cost!=null?diff*p.cost:null;if(val)total+=val;
    rows.push({p,theo,counted,diff,val})}
  return {rows,total,initial};
}
function needs(){
  const sup=[],tr=[];
  for(const d of depots())for(const p of prods()){const q=stockAt(d.id,p.id);
    if(p.minD>0&&q<p.minD){let o=(p.tgtD>0?p.tgtD:p.minD)-q;const pk=p.pack>0?p.pack:1;o=Math.ceil(r3(o/pk))*pk;
      sup.push({d,p,q,o,cost:p.cost!=null?o*p.cost:null})}}
  const dep=depots()[0];
  for(const s of restos())for(const p of prods()){const q=stockAt(s.id,p.id);
    if(p.minR>0&&q<p.minR){const o=r3((p.tgtR>0?p.tgtR:p.minR)-q);tr.push({s,p,q,o,avail:dep?stockAt(dep.id,p.id):null})}}
  sup.sort((a,b)=>String(a.p.supplier||'').localeCompare(b.p.supplier||''));
  return {sup,tr};
}

/* ---------- import ---------- */
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function toIso(v){const p=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  if(typeof v==='number'){if(typeof XLSX==='undefined')return null;const o=XLSX.SSF.parse_date_code(v);return o?p(o.y,o.m,o.d):null}
  const s=String(v??'').trim();let m;
  if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})/))){const i=MON.indexOf(m[1].toLowerCase());return i<0?null:p(m[3],i+1,+m[2])}
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return p(m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return p(m[3],+m[2],+m[1]);
  return null}
/* Règle de nommage : « Menu … » = burger + frites + boisson ; « … Stripster » = 1 pièce, « Menu … Stripster » = 2 pièces. */
function guess(name){const n=norm(name),c=S.cfg||{},comp=(id,q)=>id&&byId(S.products,id)?[{pid:id,qty:q}]:[];
  const menu=/^menu\b/.test(n);const dr=menu?comp(c.drink,1):[];
  if(/strip/.test(n))return {components:[...comp(c.chicken,menu?2:1),...dr],bag:true,drink:menu};
  if(menu)return {components:[...comp(c.chicken,1),...comp(c.bun,1),...comp(c.box,1),...dr],bag:true,drink:true};
  return null}
function parseExport(rows){
  const hi=rows.findIndex(r=>r&&r.some(c=>String(c??'').trim()==='Ticket No.'));
  if(hi<0)throw new Error("Ce fichier n'est pas l'export des tickets : la colonne « Ticket No. » est introuvable.");
  const H=rows[hi].map(c=>String(c??'').trim()),col=n=>H.indexOf(n);
  const cN=col('Ticket No.'),cD=col('Date'),cT=col('Ticket name'),cA=col('Designations (Reference)'),cR=col('Refund'),cL=col('Location');
  if(cD<0||cT<0||cA<0)throw new Error("Colonnes « Date », « Ticket name » ou « Designations (Reference) » manquantes.");
  const byName={};S.menu.forEach(it=>byName[norm(it.name)]=it);
  const days={},locs={};let skipped=0;
  for(const r of rows.slice(hi+1)){if(!r||!String(r[cN]??'').trim())continue;
    const date=toIso(r[cD]);if(!date||(cR>=0&&+r[cR]>0)){skipped++;continue}
    if(cL>=0)locs[String(r[cL]).trim()]=1;
    const d=days[date]=days[date]||{date,tickets:0,deliv:0,bags:0,names:{}};d.tickets++;
    const tn=String(r[cT]??'').trim(),isDel=/^\d/.test(tn)||/^emp/i.test(tn);let n=0;
    for(const part of String(r[cA]??'').split(/,\s*(?=\d+\s*[×x]\s)/)){const m=part.trim().match(/^(\d+)\s*[×x]\s+(.+)$/);if(!m)continue;
      const q=+m[1],name=m[2].trim(),k=norm(name);
      d.names[k]={name,q:((d.names[k]||{}).q||0)+q};
      const g=byName[k]||guess(name);if(g&&g.bag)n+=q}
    if(isDel){d.deliv++;d.bags+=Math.max(1,Math.ceil(n/2))}}
  return {days,skipped,locs:Object.keys(locs)};
}
function dayUsage(d){
  const byName={};S.menu.forEach(it=>byName[norm(it.name)]=it);const usage={},unknown=[];let drinks=0;
  for(const [k,x] of Object.entries(d.names)){const it=byName[k],g=it||guess(x.name);
    if(!it)unknown.push({name:x.name,g});if(!g)continue;
    if(g.drink&&!(g.components||[]).some(c=>c.pid===(S.cfg||{}).drink&&c.qty))drinks+=x.q;
    for(const c of g.components||[])if(c.pid&&c.qty)usage[c.pid]=r3((usage[c.pid]||0)+x.q*c.qty)}
  const bag=(S.cfg||{}).bag,extra={};
  if(d.bags&&bag&&byId(S.products,bag)){extra[bag]=d.bags;usage[bag]=r3((usage[bag]||0)+d.bags)}
  return {usage,extra,drinks,unknown};
}

const head=(t,s)=>`<header class="vh"><h1>${t}</h1>${s?`<p>${s}</p>`:''}</header>`;

function famRows(ps,cols,rowFn){let fam=null,h='';const grouped=new Set(ps.map(p=>p.family)).size<ps.length;for(const p of ps){if(grouped&&p.family!==fam){fam=p.family;h+=`<tr class="fam"><th colspan="${cols}">${esc(fam||'Autres')}</th></tr>`}h+=rowFn(p)}return h}
const seg=(items,cur,act)=>`<div class="seg">${items.map(([id,l])=>`<button data-act="${act}" data-id="${esc(id)}" aria-pressed="${id===cur}">${l}</button>`).join('')}</div>`;

function tasks(){
  const t=[],y=daysAgo(1),ps=prods();
  if(!ps.length)return [{s:'todo',t:'Ajouter vos produits',d:'La liste des produits suivis est vide.',a:['reglages','Ouvrir les réglages']}];
  const noCost=ps.filter(p=>p.cost==null).length,noMin=ps.filter(p=>!(p.minR>0)&&!(p.minD>0)).length;
  if(noCost||noMin)t.push({s:'todo',t:'Compléter les réglages des produits',d:[noCost?pl(noCost,"produit sans coût d'achat","produits sans coût d'achat"):'',noMin?pl(noMin,"sans seuil d'alerte","sans seuil d'alerte"):''].filter(Boolean).join(', ')+'. La valeur du stock et les alertes en dépendent.',a:['reglages','Ouvrir les réglages']});
  for(const s of sitesSorted())if(!(CNT[s.id]||[]).length)t.push({s:'todo',t:`Compter le stock de départ : ${s.name}`,d:'Sans ce premier inventaire, le stock affiché part de zéro.',a:['inventaire',"Faire l'inventaire"],count:s.id});
  for(const s of restos()){const d=byId(S.sales,y+'_'+s.id);
    t.push(d?{s:'done',t:`Ventes d'hier enregistrées : ${s.name}`,d:dlong(y)+(d.tickets?', '+d.tickets+' tickets':'')}:{s:'todo',t:`Importer les ventes d'hier : ${s.name}`,d:dlong(y),a:['ventes','Importer les ventes'],sale:s.id})}
  let neg=0;for(const s of S.sites)for(const p of ps)if(stockAt(s.id,p.id)<0)neg++;
  if(neg)t.push({s:'warn',t:pl(neg,'stock négatif','stocks négatifs'),d:"Une réception, un transfert ou un inventaire n'a pas été saisi.",a:['stock','Voir le stock']});
  const n=needs();
  if(n.sup.length)t.push({s:'warn',t:pl(n.sup.length,'produit à commander pour le dépôt','produits à commander pour le dépôt'),d:n.sup.map(x=>x.p.name).join(', '),a:['commandes','Voir la commande']});
  if(n.tr.length)t.push({s:'warn',t:pl(n.tr.length,'réassort à envoyer en restaurant','réassorts à envoyer en restaurant'),d:n.tr.map(x=>x.p.name+' ('+x.s.name+')').join(', '),a:['commandes','Voir les transferts']});
  for(const s of sitesSorted()){const cs=CNT[s.id]||[];if(!cs.length)continue;const last=cs[cs.length-1].date,n=dayDiff(last,today());
    t.push(n>7?{s:'todo',t:`Refaire l'inventaire : ${s.name}`,d:`Dernier comptage il y a ${n} jours. Un comptage par semaine garde le stock fiable.`,a:['inventaire',"Faire l'inventaire"],count:s.id}
      :{s:'done',t:`Inventaire à jour : ${s.name}`,d:n<=0?"Compté aujourd'hui":n===1?'Compté hier':`Compté il y a ${n} jours`})}
  const o={todo:0,warn:1,done:2};return t.sort((a,b)=>o[a.s]-o[b.s]);
}

function vStock(){

  const from30=daysAgo(30);let gap=0,ng=0;
  for(const c of S.counts)if(c.date>from30&&ids.includes(c.siteId)){const g=gaps(c);if(!g.initial){gap+=g.total;ng++}}
  let cm=0;const from7=daysAgo(7);for(const s of S.sales)if(s.date>from7&&ids.includes(s.siteId))cm+=costOf(s.usage);

  }else{

  seg([['','Tous les sites'],...sites.map(s=>[s.id,esc(s.name)])],sel?sel.id:'','stockSite')+

    }<tr class="tot"><th colspan="5">Total</th><td class="n"><span class="${g.total<0?'negv':''}">${money(g.total)}</span></td></tr></tbody></table></div>
    <p class="help">Un écart négatif veut dire qu'il manque du stock par rapport aux ventes : pertes non saisies, portions trop généreuses, vol, ou erreur de recette ou de saisie.</p>`)+'</div>'}
  return head('Inventaire',"Comptez ce qu'il y a réellement en fin de journée. Le comptage corrige le stock et montre ce qui a disparu.")+
  `<section><div class="panel"><div class="row">

function vOrders(){
  const ps=prods();if(!ps.length)return head('À commander','')+noData();
  const {sup,tr}=needs();const hasMin=ps.some(p=>p.minD>0||p.minR>0);
  const hint=hasMin?'':`<div class="panel"><p>Aucun seuil d'alerte n'est défini, donc rien ne peut être proposé.</p><div><a class="btn primary" href="#reglages">Définir les seuils</a></div></div>`;
  let tot=0;sup.forEach(x=>tot+=x.cost||0);
  return head('À commander',"Propositions calculées quand un stock passe sous son seuil d'alerte, pour revenir au niveau souhaité.")+hint+
  `<section><div class="split"><h2>À commander aux fournisseurs</h2>${sup.length?'<button data-act="copyOrder">Copier la commande</button>':''}</div>${sup.length?`<div class="panel flush"><div class="tw"><table><thead><tr><th>Produit</th><th>Fournisseur</th><th class="n">Stock au dépôt</th><th class="n">Seuil</th><th class="n">À commander</th><th class="n">Coût estimé</th></tr></thead><tbody>${
    sup.map(x=>`<tr><th>${pname(x.p)}</th><td>${esc(x.p.supplier||'–')}</td><td class="n"><span class="q ${status(x.d,x.p,x.q)}">${f(x.q)}</span></td><td class="n muted">${f(x.p.minD)}</td><td class="n b">${f(x.o)}</td><td class="n">${x.cost!=null?money(x.cost):'<span class="todo">coût à saisir</span>'}</td></tr>`).join('')
    }<tr class="tot"><th colspan="5">Total estimé</th><td class="n">${money(tot)}</td></tr></tbody></table></div></div>`:`<p class="help">${hasMin?'Rien à commander : le dépôt est au-dessus de ses seuils.':''}</p>`}</section>
  <section><h2>À envoyer aux restaurants</h2>${tr.length?`<div class="panel flush"><div class="tw"><table><thead><tr><th>Produit</th><th>Restaurant</th><th class="n">Stock sur place</th><th class="n">Seuil</th><th class="n">À envoyer</th><th class="n">Disponible au dépôt</th></tr></thead><tbody>${
    tr.map(x=>`<tr><th>${pname(x.p)}</th><td>${esc(x.s.name)}</td><td class="n"><span class="q ${status(x.s,x.p,x.q)}">${f(x.q)}</span></td><td class="n muted">${f(x.p.minR)}</td><td class="n b">${f(x.o)}</td><td class="n">${x.avail==null?'–':f(x.avail)+(x.avail<x.o?' <span class="pill low">Insuffisant</span>':'')}</td></tr>`).join('')
    }</tbody></table></div></div>`:`<p class="help">${hasMin?'Aucun restaurant sous son seuil.':''}</p>`}</section>`;
}

      const sum=(it.components||[]).map(c=>f(c.qty,3)+' '+esc((byId(S.products,c.pid)||{name:'produit supprimé'}).name)).join(', ');
      const open=st.edit===it.id;
      return `<div class="rcp" data-n="${esc(norm(it.name))}"${q&&!norm(it.name).includes(q)?' hidden':''}>
      <div class="sum"><div><b>${esc(it.name)}${it.auto?' <span class="pill info">Ajouté par un import</span>':''}</b><small>${it.skip?'Ne retire rien du stock':sum||'<span class="todo">Recette vide : ne retire rien du stock</span>'}</small></div>
        <button class="${open?'primary':''}" data-act="editRc" data-id="${esc(it.id)}">${open?'Terminer':'Modifier'}</button></div>

    body=`<p class="help">Une recette dit ce qu'une vente retire du stock. Les nouveaux articles de la caisse arrivent ici après un import.</p>
    <div class="split">${seg([['stock',`Suivent le stock (${cnt.stock})`],['hors',`Hors stock (${cnt.hors})`],['todo',`À classer (${cnt.todo})`]],st.filter,'rcFilter')}
      <label for="rc-q" style="flex-direction:row;align-items:center;gap:8px">Chercher<input id="rc-q" type="search" value="${esc(st.q||'')}" autocomplete="off"></label></div>

    <div><button class="primary" data-act="addMenu">Ajouter un article</button></div>`;
  }else if(st.tab==='sites'){
    body=`<p class="help">Le dépôt reçoit les livraisons des fournisseurs et réapprovisionne les restaurants.</p>

      <td><select aria-label="Type" data-f="type" data-path="sites/${esc(s.id)}"><option value="depot"${s.type==='depot'?' selected':''}>Dépôt central</option><option value="restaurant"${s.type!=='depot'?' selected':''}>Restaurant</option></select></td>
      <td class="n"><button class="ghost" data-act="del" data-path="sites/${esc(s.id)}">Supprimer</button></td></tr>`).join('')}</tbody></table></div></div>
    <div><button class="primary" data-act="addSite">Ajouter un restaurant</button></div>`;
  }else{
    body=`<div class="panel"><h2>Comment l'import lit l'export de caisse</h2><ul class="plain">
      <li>Un article dont le nom commence par « Menu » retire 1 pièce de poulet, 1 pain, 1 boîte et 1 boisson.</li>
      <li>Un Stripster retire 1 pièce de poulet. Un Menu Stripster en retire 2, plus 1 boisson.</li>
      <li>Un ticket dont le nom commence par un chiffre ou par « Emp » est une livraison : 1 sachet pour 2 burgers ou stripsters, arrondi au-dessus.</li>
      <li>Les tickets « Sp » sont sur place : aucun sachet.</li></ul>
      <p class="help">Ces règles servent pour les articles nouveaux. Dès qu'un article a sa recette, c'est la recette qui compte.</p>
      <h3>Produits utilisés par ces règles</h3>
      <div class="row">${[['chicken','Pièce de poulet'],['bun','Pain'],['box','Boîte burger'],['drink','Boisson'],['bag','Sachet de livraison']].map(([k,l])=>`<label for="cf-${k}">${l}<select id="cf-${k}" data-f="${k}" data-path="config/import"><option value="">Aucun</option>${opts(po,(S.cfg||{})[k])}</select></label>`).join('')}</div></div>`;
  }
  return head('Réglages','Chaque modification est enregistrée dès que vous quittez le champ.')+tabs+`<section>${body}</section>`;

/* ---------- render + routing ---------- */
const RENDER={accueil:vHome,stock:vStock,mouvements:vMoves,ventes:vSales,inventaire:vCount,commandes:vOrders,reglages:vSettings};
const current=()=>{const h=location.hash.slice(1);return VIEWS.includes(h)?h:'accueil'};
function render(force){
  const v=current();
  document.querySelectorAll('nav a').forEach(a=>a.dataset.v===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(!ready.sites||!ready.products)return;
  const n=needs(),nb=document.getElementById('nb'),c=n.sup.length+n.tr.length;nb.hidden=!c;nb.textContent=c;
  const nt=document.getElementById('nt'),o=tasks().filter(x=>x.s!=='done').length;nt.hidden=!o;nt.textContent=o;
  const a=document.activeElement;
  if(!force&&a&&view.contains(a)&&a.matches('input,select,textarea'))return;
  view.innerHTML=RENDER[v]();
}
addEventListener('hashchange',()=>{render(true);document.querySelector('main').scrollTop=0});

/* ---------- actions ---------- */
function collect(attr){const o={};view.querySelectorAll(`[data-${attr}]`).forEach(i=>{const x=num(i.value);if(x!=null)o[i.dataset[attr]]=x});return o}
async function importFile(file){
  try{if(typeof XLSX==='undefined')throw new Error("Le lecteur Excel n'a pas pu se charger. Rechargez la page.");
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const imp=parseExport(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}));
    if(!Object.keys(imp.days).length)throw new Error('Aucun ticket lisible dans ce fichier.');ui.imp=imp}
  catch(err){ui.imp=null;toast(err.message||'Fichier illisible.',true)}
  render(true);
}
view.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
view.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
view.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(!d)return;e.preventDefault();const file=e.dataTransfer.files[0];if(file)importFile(file)});
view.addEventListener('toggle',e=>{if(e.target.id==='manual')ui.sale.open=e.target.open},true);
view.addEventListener('input',e=>{const i=e.target;
  if(i.id==='rc-q'){ui.set.q=i.value;const q=norm(i.value);view.querySelectorAll('.rcp').forEach(r=>r.hidden=!!q&&!r.dataset.n.includes(q));return}
  if(i.dataset.cq==null)return;const cell=i.closest('tr').querySelector('[data-diff]');if(!cell)return;const x=num(i.value);
  cell.innerHTML=(x==null||i.dataset.theo==='')?'':diffHtml(r3(x-(+i.dataset.theo)))});
view.addEventListener('change',async e=>{const el=e.target,d=el.dataset;
  if(el.id==='sl-file'){const file=el.files[0];if(file){el.blur();await importFile(file)}return}
  if(el.id==='rc-q')return;
  if(d.ui){const [a,b]=d.ui.split('.');ui[a][b]=el.value;el.blur();render(true);return}
  if(d.f){let v=el.type==='checkbox'?el.checked:el.value.trim();if(d.num){v=num(v);if(v!=null&&v<0)v=null}else if(d.f==='name'&&!v){toast('Le nom ne peut pas être vide.',true);render(true);return}
    if(await w(()=>db.doc(d.path).update(d.f==='skip'||d.f==='bag'?{[d.f]:v,todo:false}:{[d.f]:v})))toast('Enregistré.');return}
  if(d.k){const it=byId(S.menu,d.menu);if(!it)return;const comps=(it.components||[]).map(c=>({...c}));
    comps[+d.i][d.k]=d.k==='qty'?(num(el.value)||0):el.value;await w(()=>db.doc('menu/'+it.id).update({components:comps,todo:false}),'Enregistré.')}
});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&!e.target.closest('form'))e.target.blur()});
view.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,ds=b.dataset;
  if(act==='go'){if(ds.count)ui.count.site=ds.count;if(ds.sale)ui.sale.site=ds.sale;if(ds.type){ui.move.type=ds.type;ui.move.site=''}
    if(location.hash==='#'+ds.to)render(true);else location.hash=ds.to;return}
  if(act==='stockSite'){ui.stock.site=ds.id;render(true);return}
  if(act==='mvType'){ui.move.type=ds.id;ui.move.site='';render(true);return}
  if(act==='setTab'){ui.set.tab=ds.id;render(true);return}
  if(act==='rcFilter'){ui.set.filter=ds.id;ui.set.edit='';render(true);return}
  if(act==='editRc'){ui.set.edit=ui.set.edit===ds.id?'':ds.id;render(true);return}
  if(act==='del'){if(!ds.armed){const t=b.textContent;ds.armed='1';b.textContent='Confirmer la suppression';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},3500);return}
    await w(()=>db.doc(ds.path).delete(),'Supprimé.');render(true);return}
  if(act==='saveMove'){const m=ui.move,lines=collect('mq');const site=document.getElementById('mv-site').value,to=m.type==='transfert'?document.getElementById('mv-to').value:null;
    if(!Object.keys(lines).length){toast('Saisissez au moins une quantité.',true);return}
    if(Object.values(lines).some(q=>q<=0)){toast('Les quantités doivent être positives.',true);return}
    if(m.type==='transfert'&&site===to){toast('Choisissez deux sites différents.',true);return}
    if(!m.date){toast('Choisissez une date.',true);return}
    const note=document.getElementById('mv-note').value.trim();
    if(await w(()=>db.collection('movements').doc(uid('m')).set({type:m.type,date:m.date,siteId:site,toSiteId:to,lines,note,ts:Date.now()}),'Mouvement enregistré, stock mis à jour.'))render(true);return}
  if(act==='cancelImport'){ui.imp=null;render(true);return}
  if(act==='saveImport'){const imp=ui.imp,site=document.getElementById('sl-site').value;if(!imp||!site)return;
    const days=Object.values(imp.days);b.disabled=true;
    const ok=await w(async()=>{const ids={};S.menu.forEach(it=>ids[norm(it.name)]=it.id);
      for(const d of days)for(const [k,x] of Object.entries(d.names))if(!ids[k]){const g=guess(x.name),id=uid('a');
        await db.doc('menu/'+id).set(g?{name:x.name,components:g.components,bag:!!g.bag,drink:!!g.drink,auto:true}:{name:x.name,components:[],todo:true});ids[k]=id}
      for(const d of days){const u=dayUsage(d),items={};for(const [k,x] of Object.entries(d.names))items[ids[k]]=x.q;
        await db.doc('sales/'+d.date+'_'+site).set({date:d.date,siteId:site,items,usage:u.usage,extra:u.extra,tickets:d.tickets,deliv:d.deliv,menuDrinks:u.drinks,source:'caisse',ts:Date.now()})}
    },'Ventes enregistrées, stock mis à jour.');
    if(ok){ui.sale.date=days.map(d=>d.date).sort().pop();ui.imp=null}render(true);return}
  if(act==='saveSale'){const u=ui.sale,site=document.getElementById('sl-site').value,old=byId(S.sales,u.date+'_'+site),items={...((old&&old.items)||{})};
    view.querySelectorAll('[data-sq]').forEach(i=>delete items[i.dataset.sq]);Object.assign(items,collect('sq'));const extra=(old&&old.extra)||{};
    if(!u.date||!site){toast('Choisissez un jour et un restaurant.',true);return}
    for(const k in items)if(items[k]<=0)delete items[k];
    const usage={};for(const [id,q] of Object.entries(items)){const it=byId(S.menu,id);for(const c of (it&&it.components)||[])if(c.pid&&c.qty)usage[c.pid]=r3((usage[c.pid]||0)+q*c.qty)}
    for(const [pid,q] of Object.entries(extra))usage[pid]=r3((usage[pid]||0)+q);
    const ref=db?db.doc('sales/'+u.date+'_'+site):null;
    const ok=Object.keys(items).length?await w(()=>ref.set({...(old||{}),id:undefined,date:u.date,siteId:site,items,usage,extra,ts:Date.now()}),'Journée enregistrée, stock mis à jour.'):await w(()=>ref.delete(),'Journée vidée.');
    if(ok)render(true);return}
  if(act==='saveCount'){const u=ui.count,site=document.getElementById('ct-site').value,counted=collect('cq');
    if(!u.date||!site){toast('Choisissez une date et un site.',true);return}
    if(Object.values(counted).some(q=>q<0)){toast('Une quantité comptée ne peut pas être négative.',true);return}
    if(!Object.keys(counted).length){toast('Saisissez au moins un produit compté.',true);return}
    if(await w(()=>db.doc('counts/'+u.date+'_'+site).set({date:u.date,siteId:site,counted,ts:Date.now()}),'Inventaire enregistré, stock corrigé.')){ui.count.sel=u.date+'_'+site;render(true)}return}
  if(act==='addSite'){await w(()=>db.doc('sites/'+uid('s')).set({name:'Nouveau restaurant',type:'restaurant'}));render(true);return}
  if(act==='addProd'){await w(()=>db.doc('products/'+uid('p')).set({name:'Nouveau produit',family:FAMILIES[0],unit:'pièce',cost:null,pack:null,supplier:'',minR:null,tgtR:null,minD:null,tgtD:null}));render(true);return}
  if(act==='addMenu'){const id=uid('a');if(await w(()=>db.doc('menu/'+id).set({name:'Nouvel article',components:[]}))){ui.set.filter='stock';ui.set.q='';ui.set.edit=id}render(true);return}
  if(act==='addComp'||act==='delComp'){const it=byId(S.menu,ds.menu);if(!it)return;const comps=(it.components||[]).map(c=>({...c}));
    if(act==='addComp'){const p=prods()[0];if(!p){toast("Ajoutez d'abord un produit.",true);return}comps.push({pid:p.id,qty:1})}else comps.splice(+ds.i,1);
    await w(()=>db.doc('menu/'+it.id).update({components:comps}));render(true);return}
  if(act==='copyOrder'){const {sup}=needs();let txt='Commande du '+dfr(today())+'\n',last=null;
    for(const x of sup){const s=x.p.supplier||'Fournisseur à préciser';if(s!==last){txt+='\n'+s+'\n';last=s}txt+='- '+x.p.name+' : '+f(x.o)+' '+(x.p.unit||'')+'\n'}
    try{await navigator.clipboard.writeText(txt);toast('Commande copiée.')}catch(_){toast('Copie refusée par le navigateur.',true)}}
});

/* ---------- data (Supabase) ---------- */
const sync=document.getElementById('sync'),logoutBtn=document.getElementById('logout');
const COLS={sites:'sites',products:'products',menu:'menu',movements:'moves',sales:'sales',counts:'counts'};
const DOCS={};let sb=null,logged=false;
function derive(){
  for(const [col,key] of Object.entries(COLS))S[key]=Object.entries(DOCS[col]||{}).map(([id,data])=>({...data,id}));
  for(const k of ['moves','sales','counts'])S[k].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
  S.cfg=(DOCS.config||{}).import||{};rebuild();
}
async function loadAll(){
  const all={};let from=0;
  for(;;){const {data,error}=await sb.from('stock_docs').select('col,id,data').order('col').order('id').range(from,from+999);
    if(error)throw error;for(const r of data)(all[r.col]=all[r.col]||{})[r.id]=r.data;if(data.length<1000)break;from+=1000}
  for(const k in DOCS)delete DOCS[k];Object.assign(DOCS,all);derive();
}
function mkdb(){
  const doc=path=>{const [col,id]=path.split('/');
    const put=async data=>{data=JSON.parse(JSON.stringify(data));delete data.id;const {error}=await sb.from('stock_docs').upsert({col,id,data});if(error)throw error;(DOCS[col]=DOCS[col]||{})[id]=data;derive();render(false)};
    return {set:put,update:d=>put({...((DOCS[col]||{})[id]||{}),...d}),
      delete:async()=>{const {error}=await sb.from('stock_docs').delete().eq('col',col).eq('id',id);if(error)throw error;if(DOCS[col])delete DOCS[col][id];derive();render(false)}}};
  return {doc,collection:col=>({doc:id=>doc(col+'/'+id)})};
}
function showLogin(){
  logoutBtn.hidden=true;sync.textContent='Non connecté';
  view.innerHTML=`<header class="vh"><h1>Connexion</h1><p>Utilisez l'adresse e-mail et le mot de passe que l'administrateur vous a donnés.</p></header>
  <form class="panel" id="login"><label for="lg-mail">Adresse e-mail<input type="email" id="lg-mail" autocomplete="username" required></label>
  <label for="lg-pass">Mot de passe<input type="password" id="lg-pass" autocomplete="current-password" required></label>
  <div><button class="primary big" type="submit">Se connecter</button></div></form>`;
}
async function onSession(session){
  if(!session){logged=false;db=null;ready.sites=ready.products=false;showLogin();return}
  if(logged)return;logged=true;db=mkdb();sync.textContent='Chargement…';
  try{await loadAll();ready.sites=ready.products=true;sync.textContent=session.user.email||'Connecté';logoutBtn.hidden=false;render(true)}
  catch(e){logged=false;view.innerHTML='<div class="panel"><p>Les données ne se chargent pas'+(e&&e.message?' : '+esc(e.message):'')+'. Rechargez la page.</p></div>'}
}
view.addEventListener('submit',async e=>{if(e.target.id!=='login')return;e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById('lg-mail').value.trim(),password:document.getElementById('lg-pass').value});
  if(error)toast('Adresse ou mot de passe incorrect.',true)});
logoutBtn.addEventListener('click',()=>sb&&sb.auth.signOut());
document.addEventListener('visibilitychange',()=>{if(document.hidden||!logged)return;const a=document.activeElement;
  if(a&&view.contains(a)&&a.matches('input,select,textarea'))return;loadAll().then(()=>render(false)).catch(()=>{})});
function start(){
  render(true);
  if(SUPABASE_URL.startsWith('__')||typeof supabase==='undefined'){view.innerHTML='<div class="panel"><p>La connexion à la base de données n\'a pas pu démarrer. Rechargez la page.</p></div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((_ev,session)=>setTimeout(()=>onSession(session),0));
}
start();
</script>
